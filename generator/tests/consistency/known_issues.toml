# Issues generated projects have today, each with the package that fixes it. The runner fails on an
# issue that is not listed, and the full run also fails on a listed one that no longer occurs, so
# this list only shrinks. `match` is a regular expression searched in the issue line; {pkg} is the
# package path and {package} the package.

[[issue]]
match = "^CONVENTION AndroidFirebaseConventionPlugin is never registered$"
owner = "WP06"
why = "the plugin's registration is fenced by <opt:firebase>, its file is not owned by firebase"

[[issue]]
match = "^CONVENTION AndroidRoomConventionPlugin is never registered$"
owner = "WP06"
why = "the plugin ships with room and database both off; ownership cannot say 'when both are off'"

[[issue]]
match = "^UNUSED-IMPORT app/src/main/kotlin/\\{pkg\\}/ui/AppDestinations\\.kt: \\{package\\}\\.(R|core\\.designsystem\\.icon\\.AppIcons)$"
owner = "WP04"
why = "the imports sit outside the <opt:> blocks of the tabs that use them"

[[issue]]
match = "^UNUSED-IMPORT core/network/src/test/kotlin/\\{pkg\\}/core/network/KtorNetworkClientTest\\.kt: kotlinx\\.serialization\\.json\\.(JsonPrimitive|buildJsonObject)$"
owner = "WP06"
why = "used only by the room-gated cache tests"

[[issue]]
match = "^UNUSED-RES app/src/main/res/drawable/ic_notification\\.xml: drawable/ic_notification$"
owner = "WP06"
why = "only push uses the notification icon, and push does not own the file"
