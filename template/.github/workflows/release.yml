name: Release

# Cuts a signed build from a tag.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# ## Secrets this needs
#
# | Secret                       | What it is                                             |
# |------------------------------|--------------------------------------------------------|
# | `PLAYSTORE_KEYSTORE_BASE64`  | `base64 -w0 keys/playstore.jks`                        |
# | `PLAYSTORE_STORE_PASSWORD`   |                                                        |
# | `PLAYSTORE_KEY_ALIAS`        |                                                        |
# | `PLAYSTORE_KEY_PASSWORD`     |                                                        |
# | `GOOGLE_SERVICES_JSON`       | the real `google-services.json`, if you use Firebase   |
#
# The keystore is base64 because a GitHub secret is text. It is written to disk, used, and the
# whole workspace is discarded when the runner is torn down.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      variant:
        description: Which release variant to build
        required: true
        default: playstoreRelease
        type: choice
        options: [devRelease, stagingRelease, prodRelease, playstoreRelease]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PLAYSTORE_KEYSTORE_BASE64 is not set. The build would silently fall \
          back to the debug key and produce an artifact Play will reject."
            exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 --decode > keys/playstore.jks
          cat > keystore.properties <<EOF
          playstore.storeFile=keys/playstore.jks
          playstore.storePassword=$STORE_PASSWORD
          playstore.keyAlias=$KEY_ALIAS
          playstore.keyPassword=$KEY_PASSWORD
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Determine variant
        id: variant
        run: echo "name=${{ inputs.variant || 'playstoreRelease' }}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        # `dist<Variant>` names each artifact with its variant, ABI, version and build time and
        # writes a checksum manifest beside them — see ReleaseArtifacts.kt.
        run: |
          VARIANT="${{ steps.variant.outputs.name }}"
          CAPITALISED="$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew "dist${CAPITALISED}" --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.name }}
          path: app/build/outputs/dist/
          retention-days: 30

      - name: Upload mapping file
        # Without this, a crash report from this build is unreadable — and the mapping cannot be
        # reconstructed after the fact.
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.variant.outputs.name }}
          path: app/build/outputs/mapping/
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: rm -f keys/playstore.jks keystore.properties
