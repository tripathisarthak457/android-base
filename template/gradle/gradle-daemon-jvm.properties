# The JDK the Gradle daemon itself runs on.
#
# Pinned to 17, the same version everything in this project targets, so one JDK compiles the
# Kotlin, runs detekt and runs lint. Leaving it to whatever the developer happens to have means a
# build that passes on one machine and fails on another for reasons that have nothing to do with
# the code — detekt in particular refuses to run on a JVM newer than the release knows about, and
# reports it as "Invalid value (25) passed to --jvm-target".
#
# Gradle finds a local JDK 17 if there is one and downloads it through the foojay resolver in
# settings.gradle.kts if there is not. No exact-build URLs are pinned here on purpose: those go
# stale, and a build that fails because a specific JDK tarball moved is worse than one that picks
# up a patch release.
toolchainVersion=17
