# ─────────────────────────────────────────────────────────────────────────────
# Build behaviour. Tuned for the thing this project does hundreds of times a day:
# flip between devDebug and stagingDebug and back without waiting.
#
# The three settings that actually buy that are the configuration cache, the
# build cache and non-transitive R classes. The first two make a variant switch
# reuse work rather than redo it; the third stops a colour change in
# :core:designsystem from recompiling the R class of every module downstream.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true

kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

ksp.incremental=true
ksp.useKSP2=true

android.useAndroidX=true
# A module sees only its own resources through R, not every transitive dependency's. Keeps R
# classes small and stops an unrelated module's resource change from invalidating this one.
android.nonTransitiveRClass=true
# Non-final resource IDs let AGP skip regenerating and recompiling R on most edits.
android.nonFinalResIds=true
android.enableResourceOptimizations=true
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Set to true, run any compile task, then read build/compose_metrics — tells you exactly which
# composables are unstable and skipping unnecessarily. Left off because it costs ~15% build time.
enableComposeCompilerMetrics=false
enableComposeCompilerReports=false
