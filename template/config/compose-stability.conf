// Types the Compose compiler cannot see inside, but which are in fact immutable.
//
// Without an entry here, a composable taking a java.time.LocalDate parameter is treated as
// unstable and re-runs on every recomposition of its parent, taking its whole subtree with it.
// The compiler has no way to prove immutability for a class it did not compile, so it is told.

java.time.*
java.util.UUID
kotlin.time.*
kotlinx.collections.immutable.*
kotlinx.serialization.json.JsonElement
