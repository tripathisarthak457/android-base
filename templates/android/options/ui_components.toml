key = "ui_components"
title = "UI components"
label = "No UI components"
headline = "Setup only: the architecture, every build guard and a theme skeleton, without UI components"
description = """
Every non-UI part of the project: the modules, MVI, Navigation 3 with deep links and process-death restore, data, DI,
tests and every build guard. core:designsystem is a theme skeleton (AppTheme with colour, type, spacing, shape and
motion slots, filled with neutral values and your colours and font) with no components; each screen is a one-line
placeholder route over its ViewModel, and the app opens on a blank start screen. The developer panel, the performance
overlay and LeakCanary stay."""
default = true
variant = "noui"
# What only a project with UI components has. The navigation shell is a module of its own
# (core/navigation/shell); the runtime in core/navigation stays, with the host's No-UI variant.
owns = [
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/component",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/foundation/content",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/foundation/draw",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/foundation/interaction",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/foundation/layout",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/foundation/scroll",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/animation",
  "core/designsystem/src/main/kotlin/{pkg_path}/core/designsystem/icon",
  "core/designsystem/src/main/res/values/strings.xml",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/component",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/animation",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/foundation/draw",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/foundation/interaction",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/foundation/scroll",
  "core/designsystem/src/test/kotlin/{pkg_path}/core/designsystem/RecompositionJourneysTest.kt",
  "core/navigation/shell",
  "core/ui/src/main/kotlin/{pkg_path}/core/ui/AppNetworkImage.kt",
  "core/ui/src/main/kotlin/{pkg_path}/core/ui/paging",
  "app/src/dev/kotlin/{pkg_path}/perf",
  "feature/sample/src/main/kotlin/{pkg_path}/feature/sample/list/SampleListScreen.kt",
  "feature/sample/src/main/kotlin/{pkg_path}/feature/sample/detail/SampleDetailScreen.kt",
