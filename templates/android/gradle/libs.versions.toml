# ─────────────────────────────────────────────────────────────────────────────
# Single source of truth for every dependency and plugin version.
#
# Nothing in this project declares a version inline. A module that needs a new
# library adds it here first and references it as libs.<alias>, so an upgrade is
# one edit and there is never a second copy to drift out of sync.
#
# Deliberately absent: androidx.compose.material and androidx.compose.material3.
# The design system in :core:designsystem is built on foundation + ui alone and
# supplies its own indication, typography, shapes and every component. Adding a
# material artifact back re-introduces a second, competing set of design tokens
# that will slowly leak into feature code.
# ─────────────────────────────────────────────────────────────────────────────

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
composeBom = "2026.09.00"
navigation3 = "1.2.0"
navigationevent = "1.2.0"
splashscreen = "1.2.0"
biometric = "1.1.0"
# Pinned: biometric alone would pull fragment 1.2.5 from 2020 for its FragmentActivity.
fragment = "1.9.1"

hilt = "2.60.1"
coroutines = "1.11.0"
serializationJson = "1.11.0"
datastore = "1.2.1"
desugar = "2.1.5"

ktor = "3.6.0"
okhttp = "5.5.0"
room3 = "3.0.3"
sqlite = "2.7.1"
workmanager = "2.12.0"
androidxHilt = "1.4.0"
coil = "3.6.3"
exifinterface = "1.4.2"
appUpdate = "2.1.0"
appReview = "2.0.2"
leakcanary = "2.14"
credentials = "1.6.0"
googleid = "1.2.1"
paging = "3.5.2"
browser = "1.10.0"
androidxWindow = "1.5.1"
metricsPerformance = "1.0.0"

firebaseBom = "35.0.0"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"

junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
turbine = "1.2.1"
mockk = "1.14.11"
licensee = "1.14.1"
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.1"
benchmark = "1.5.0"
baselineProfilePlugin = "1.5.0"
kover = "0.9.11"
dependencyAnalysis = "3.19.2"
spotless = "8.10.4"
ktlint = "1.8.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

[libraries]

# ── AndroidX platform ────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }

# ── Compose. No material artifact, by design — see the header. ───────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text-googlefonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-runtime-tracing = { group = "androidx.compose.runtime", name = "runtime-tracing" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# ── Navigation 3 ─────────────────────────────────────────────────────────────
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
