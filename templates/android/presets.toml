# Named starting points. Features are listed before `requires` closes over them.
default = "standard"

[lean]
title = "Lean"
description = "Networking, the design system, the catalog and one reference feature."
features = ["network", "leakcanary", "sample", "catalog"]

[standard]
title = "Standard"
description = """
The lean set plus a database, images, auth, onboarding, settings with a language picker and a
profile tab. What most projects want on day one."""
features = [
  "network", "leakcanary", "sample", "catalog",
  "database", "coil", "googlefonts", "forms", "auth", "settings", "onboarding", "deeplink",
  "flags", "devtools", "perfhud", "profile", "browser", "language",
]

[everything]
title = "Everything"
description = """
Every feature the template offers, working together. The template's own proof that they coexist;
delete what you do not need."""
all = true
