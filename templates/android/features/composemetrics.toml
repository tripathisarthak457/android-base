key = "composemetrics"
title = "Compose stability check"
headline = "Catch a component that cannot skip"
description = """
Reads the Compose compiler's own report and fails on a design-system composable that restarts
without being able to skip. A baseline holds what is already there, so it starts green and cannot
get worse."""
group = "Build and quality"
default = false
requires = []
implied_only = false
owns = [
  "build-logic/convention/src/main/kotlin/{pkg_path}/buildlogic/android/ComposeStability.kt",
  "config/compose-stability-baseline.txt",
]
legacy = []
