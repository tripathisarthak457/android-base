key = "forms"
title = "Form state and validation"
headline = "Validate forms properly"
description = """
Each field's text lives in a TextFieldState the ViewModel owns, so typing never waits on a state
update and survives process death; validators return error codes the screen turns into copy, and
server-side errors map back onto the fields that caused them."""
group = "Screens"
default = false
requires = []
implied_only = false
owns = [
  "core/common/src/main/kotlin/{pkg_path}/core/common/validation",
  "core/common/src/test/kotlin/{pkg_path}/core/common/validation",
  "core/ui/src/main/kotlin/{pkg_path}/core/ui/form",
  "core/ui/src/test/kotlin/{pkg_path}/core/ui/form",
]
legacy = []
