key = "catalog"
title = "Component catalog app"
headline = "A second app showing every component"
description = """
A second installable app showing every component and token, in the project's own design and
motion style. A bar switches theme, style, motion, right-to-left, font scale and reduced motion
live; each page opens directly with `--es section <Name>`, and a frame-time readout shows what
each interaction costs. Depends on the design system and the navigation shell, and on the image and
video modules when those features are on."""
group = "Design"
default = true
requires = []
implied_only = false
# The scene packs measure the catalog's media scenes: without the catalog they have nothing to run.
owns = [
  "catalog",
  "tools/perf/scenes_images.py",
  "tools/perf/test_scenes_images.py",
  "tools/perf/testdata/media/images",
  "tools/perf/scenes_video.py",
  "tools/perf/test_scenes_video.py",
  "tools/perf/testdata/media/video",
]
legacy = []
