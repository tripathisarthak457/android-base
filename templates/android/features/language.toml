key = "language"
title = "In-app language picker"
headline = "Let people pick the app's language"
description = """
A Language row in settings. Uses the system's per-app language on Android 13+ so it also appears
in the phone's settings, and applies it by hand on older releases."""
group = "Screens"
default = false
requires = ["settings"]
implied_only = false
owns = [
  "core/ui/src/main/kotlin/{pkg_path}/core/ui/locale",
  "app/src/main/res/resources.properties",
]
legacy = []
