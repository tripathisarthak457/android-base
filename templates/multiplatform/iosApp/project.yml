# The Xcode project, generated by XcodeGen 2.46 or later: `cd iosApp && xcodegen generate`. The
# generated BaseApp.xcodeproj is not checked in; this file is the project.
name: BaseApp
options:
  createIntermediateGroups: true
  # <generated:ios-deployment-target>
  deploymentTarget:
    iOS: "17.0"
  # </generated:ios-deployment-target>
configs:
  Dev: debug
  Prod: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BaseApp:
    type: application
    platform: iOS
    sources:
      - BaseApp
    configFiles:
      Dev: Configuration/Dev.xcconfig
      Prod: Configuration/Prod.xcconfig
    settings:
      base:
        # <generated:ios-config>
        PRODUCT_BUNDLE_IDENTIFIER: com.base.app
        DEVELOPMENT_TEAM: ""
        # </generated:ios-config>
        INFOPLIST_FILE: BaseApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # The pre-build script runs Gradle, which reads and writes outside the sandbox Xcode gives
        # build scripts by default.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile the shared Kotlin framework
        # Gradle decides what is up to date; Xcode's own analysis would skip the script whenever no
        # Swift file changed, and a Kotlin change would never reach the app.
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  BaseApp:
    build:
      targets:
        BaseApp: all
    run:
      config: Dev
    archive:
      config: Prod
