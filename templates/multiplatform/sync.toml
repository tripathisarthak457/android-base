# Code this template shares with templates/android, and every way the two copies may differ.
#
# tools/sync_check.py compares each pair with import lines left out, and fails on any other line
# that differs, on a file present on one side only, and on an allowance below that no longer
# matches anything. A change to one side is ported to the other, or recorded here with its reason.
# Paths are relative to each template. Never copied into a generated project.

[[pair]]
name = "core/common"
android = "core/common/src/main/kotlin/com/base/app/core/common"
multiplatform = "core/common/src/commonMain/kotlin/com/base/app/core/common"

[[pair.android_only]]
file = "environment/AppEnvironment.kt"
reason = """
The build facts the Android app's BuildConfig states, for its dev tooling (the devtools feature),
which only the Android template has."""

[[pair]]
name = "core/mvi"
android = "core/mvi/src/main/kotlin/com/base/app/core/mvi"
multiplatform = "core/mvi/src/commonMain/kotlin/com/base/app/core/mvi"

[[pair.difference]]
file = "MviViewModel.kt"
reason = """
The Android template's screens load on their first observation and raise their busy flags through
launchExclusive's busy reducer (decisions/LOG.md, Oct 25). This template's screens still load from
their Appeared events and set their flags by hand; they move to both together in the multiplatform
work after the Android release (REQUIREMENTS 59 (j)), and this allowance goes with them."""
android = [
