// Types the Compose compiler cannot see inside but which are immutable here. A composable taking
// one is compared with equals instead of by identity, so an equal value passed again skips it.
// Each line is a promise: verifyCodeRules keeps it for UI state (uistate-mutable) and api models
// (api-immutable); a broken promise shows stale UI rather than crashing.

// Read-only collections. equals returns at once for the same instance, which a reducer's copy()
// keeps, so the usual comparison costs what identity would. A list rebuilt with equal elements is
// walked once and spares its reader a recomposition; a changed one recomposes its reader either
// way. A list mutated in place is the same instance, which strong skipping skips anyway. So the
// jetpack-compose-performance skill's advice against stable collections does not apply here,
// while its prohibitions do: no kotlinx.collections.immutable, and no @Immutable on a model that
// carries a large or nested list into a lazy layout.
kotlin.collections.List<*>
kotlin.collections.Set<*>
kotlin.collections.Map<*,*>

java.time.*
java.util.Currency
java.util.UUID
kotlin.time.*
kotlin.ranges.*
kotlinx.serialization.json.JsonElement

// Data-layer models: plain classes in modules without the Compose compiler.
com.example.finalafter.crui3.data.*.api.**

// Core value types that screens take as parameters and keep in UI state.
com.example.finalafter.crui3.core.common.LoadState
com.example.finalafter.crui3.core.common.result.AppError
com.example.finalafter.crui3.core.common.navigation.AppNavKey
com.example.finalafter.crui3.core.mvi.UiText
com.example.finalafter.crui3.core.mvi.UiMessage
// A screen's ViewModel never changes identity while the screen is shown.
com.example.finalafter.crui3.core.mvi.MviViewModel
