// Types the Compose compiler cannot see inside but which are immutable here. A composable taking
// one is compared with equals instead of by identity, so an equal value passed again skips it.
// Each line is a promise: verifyCodeRules keeps it for UI state (uistate-mutable) and api models
// (api-immutable); a broken promise shows stale UI rather than crashing.

// Read-only collections. An equal list rebuilt by a reducer does not rerun its reader; a list
// mutated in place is the same instance, which strong skipping skips anyway.
kotlin.collections.List<*>
kotlin.collections.Set<*>
kotlin.collections.Map<*,*>

java.time.*
java.util.UUID
kotlin.time.*
kotlin.ranges.*
kotlinx.serialization.json.JsonElement

// Data-layer models: plain classes in modules without the Compose compiler.
com.example.standard.data.*.api.**

// Core value types that screens take as parameters and keep in UI state.
com.example.standard.core.common.LoadState
com.example.standard.core.common.result.AppError
com.example.standard.core.common.navigation.AppNavKey
com.example.standard.core.mvi.UiText
com.example.standard.core.mvi.UiMessage
// A screen's ViewModel never changes identity while the screen is shown.
com.example.standard.core.mvi.MviViewModel
