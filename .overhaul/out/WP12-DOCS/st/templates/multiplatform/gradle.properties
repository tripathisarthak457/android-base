# The same daemon arguments as the Android template, so one Gradle daemon and one Kotlin daemon
# serve both kinds of project on a machine that builds them side by side.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.code.style=official
# Compiles the iOS klibs on Linux and Windows as well, so a broken iOS source set fails here rather
# than on the first Mac that builds the framework. Linking the framework still needs Xcode.
kotlin.native.enableKlibsCrossCompilation=true
# The Kotlin/Native compiler runs in a process of its own rather than inside the Gradle daemon. In
# the daemon it loads enough classes to exhaust the daemon's metaspace, which then fails every task
# after it in the build, and the daemon is the one the Android builds on this machine share.
kotlin.native.disableCompilerDaemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
