key = "database"
title = "App database (SwiftData)"
headline = "Keep data on the device"
description = """
SwiftData with one model actor per data domain, so reads and writes never run on the main actor.
The reference feature becomes offline-first: it shows what it saved, refreshes when stale, and
falls back to the saved list when the network is gone."""
