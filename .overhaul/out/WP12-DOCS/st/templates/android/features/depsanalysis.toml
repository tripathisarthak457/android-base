key = "depsanalysis"
title = "Dependency health report"
headline = "See which dependencies nobody uses"
description = """
Names every module declaring a dependency it never uses, or using one it only gets transitively —
the second being the failure that surfaces months later as an unrelated module breaking.
`./gradlew buildHealth` writes the report; it is advice rather than a gate, because two of this
template's own decisions produce advice it is right to ignore."""
