# ─────────────────────────────────────────────────────────────────────────────
# Build behaviour. Tuned for the thing this project does hundreds of times a day:
# flip between devDebug and stagingDebug and back without waiting.
#
# The configuration cache and the build cache are what buy that: a variant
# switch reuses work rather than redoing it. Everything AGP and Kotlin already
# default to is left out, so `--warning-mode all` shows only real warnings.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.code.style=official

