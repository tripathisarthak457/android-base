# Feature keys that no longer exist, and the note a spec naming one receives. A key cannot be both
# removed and current, nor removed and a legacy key without a schema.
fastlane = "'fastlane' is no longer a feature and was left out."
architecturetests = "'architecturetests' is no longer a feature and was left out."
screenshottests = "'screenshottests' is no longer a feature and was left out."
staticanalysis = "'staticanalysis' is no longer a feature and was left out."
widget = "'widget' was removed: its Glance runtime started WorkManager and a database at every launch to show one line of text."
workmanager = "'workmanager' is no longer a feature: WorkManager arrives with 'offlinequeue', which has a worker to run."
room = "'room' was removed: the HTTP cache keeps GET responses, the app's own data belongs in 'database', and writes made offline in 'offlinequeue'."
composemetrics = "The Compose stability check now runs in every project, so 'composemetrics' was left out."
lottie = "Lottie was left out: it pulled in appcompat, about 190 KB of code, for one decorative animation."
