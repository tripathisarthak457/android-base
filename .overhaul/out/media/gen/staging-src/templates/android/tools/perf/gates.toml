# Device gates. `perf.sh --gate <column>` compares the median of the runs with one column and exits
# non-zero on any failing row, including a row of that column the invocation did not measure.
#
# Columns: `solid` (the everything preset, solid chrome), `standard` and `lean` (their presets, only
# the rows that apply to them), `smoke` (a tolerance against a reference run given with --baseline),
# `large` (the large-window scenarios, on a window of Expanded width or more: a tablet, or the phone
# with its display overridden, which only the phone's owner may agree to; an emulator's numbers are
# relative evidence, never a gate).
#
# A limit is a number (the metric must be at or under it), `true` (a check that must pass in every
# run) or "ratchet" (reported, not yet gated: the first measured value plus 10 % goes here). A smoke
# tolerance is a table: the reference value plus max(`add`, reference × `scale`).
#
# What gates a release (REQUIREMENTS 42): for tab switches, push/pop, the back gesture and Rapid Back,
# what the user feels, the hitch time per second of motion and the janky frames after each motion's
# first. A first frame from idle misses its deadline on this phone whatever is drawn (the GPU is still
# clocked down: an empty-content build misses it on 7 of 7 switches), so it is reported, not gated.
# Rows marked non-regression hold the worst run of the merge's acceptance plus its noise margin, and
# never more than the limit they replaced where the merge met it: they may only go down, and each
# improvement is written back here.
#
# Measured on a Redmi Note 10 Pro (120 Hz, 8.33 ms frame budget) with release builds compiled with
# their baseline profile. Frame times are UI-thread milliseconds; janky is the FrameTimeline count.

