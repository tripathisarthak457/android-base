# ─────────────────────────────────────────────────────────────────────────────
# Build behaviour. Tuned for the thing this project does hundreds of times a day:
# flip between devDebug and stagingDebug and back without waiting.
#
# The configuration cache and the build cache are what buy that: a variant
# switch reuses work rather than redoing it. Everything AGP and Kotlin already
# default to is left out, so `--warning-mode all` shows only real warnings.
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.code.style=official

# The merged-coverage floor `koverVerify` enforces, as a percentage of lines.
#
# Composables and the catalog are excluded (see the root build.gradle.kts), so this is the share
# of the logic — ViewModels, repositories, mappers, navigation rules — that unit tests reach. With
# every feature on it measures 11.1, and the floor sits a couple of points under that so moving a
# function between files does not turn the build red. It is a ratchet: raise it as tests are
# written. Lowering it to make a red build green is the one edit that turns this from a check into
# a decoration, so do that in a commit that says so.
coverageMinimum=9
