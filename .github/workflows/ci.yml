# What runs on every push.
#
# Three jobs, because the three parts of this repository fail independently and a single job would
# hide two failures behind the first one. The Android job is the slow one and is the reason this
# exists: the whole claim of the project is that a generated build is green, and a claim nobody
# checks stops being true.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    name: Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: generator
        run: python -m unittest discover -s tests -t .
      - name: The catalogue is valid JSON
        working-directory: generator
        run: python -m genkit.catalogue | python -m json.tool > /dev/null

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: web/api/go.sum
      - working-directory: web/api
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt would change these:"; gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
          go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - working-directory: web/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

  android:
    name: Generated project builds
    runs-on: ubuntu-latest
    # The slowest job by a wide margin. Worth every minute: it is the only thing standing between
    # a marker left unbalanced in one file and a broken zip going out to somebody.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [lean, everything]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5

      - name: Generate
        run: |
          cd generator
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from genkit.spec import preset_features
          spec = {
              "app_name": "Ci Check",
              "package_name": "com.example.cicheck",
              "features": sorted(preset_features("${{ matrix.preset }}")),
              "feature_modules": ["orders"],
          }
          pathlib.Path("ci-spec.json").write_text(json.dumps(spec))
          PY
          python create_project.py --spec ci-spec.json --out "$GITHUB_WORKSPACE/out" --no-zip

      - name: The wrapper is executable
        # Exit 126 here means the generator lost the bit. It is the first command the README
        # tells anyone to run, so it is checked rather than assumed.
        working-directory: out
        run: test -x ./gradlew

      - name: Build it
        working-directory: out
        run: ./gradlew build --no-daemon --stacktrace

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # The gate. Vercel is not connected to this repository on purpose: a git-connected deploy
    # fires seconds after the push, and the Android job takes nine minutes, so an Ignored Build
    # Step would only ever see a run still in progress. Making the deploy a job that `needs` the
    # others is the only version of "ship it if the tests pass" that is actually true.
    needs: [generator, api, frontend, android]
    # `needs` orders the jobs; it does not stop a pull request reaching production. Both
    # conditions are load-bearing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://android-base.vercel.app
    env:
      # Identifiers, not credentials — Vercel documents them as safe to expose, and they are
      # what `.vercel/project.json` holds locally. Only the token below is a secret.
      VERCEL_ORG_ID: team_2Uj4Ymm0UpNmpWtnZkY7dJY1
      VERCEL_PROJECT_ID: prj_6FBU7Q25qafPqU0w4v4Ogf1yp2XA
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Skips rather than fails when the token is missing, so adding this job does not turn
        # every push red for anyone who has not set the secret yet. The deploy starts happening
        # the moment it is set, with no further change here.
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set, so nothing was deployed. Add it in Settings -> Secrets to turn this job on."
            exit 0
          fi
          npx vercel@59 deploy --prod --yes --token="$VERCEL_TOKEN"

